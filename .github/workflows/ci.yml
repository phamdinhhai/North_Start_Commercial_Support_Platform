name: CI / validation gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: product
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: north_ci
          POSTGRES_PASSWORD: north_ci_only
          POSTGRES_DB: north_start_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U north_ci -d north_start_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://north_ci:north_ci_only@127.0.0.1:5432/north_start_ci
      DEPLOYMENT_MODE: test
      PILOT_STORE_MODE: memory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit (high and critical)
        run: npm run security:audit
      - name: Repository diff and secret-pattern check
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$EVENT_BEFORE_SHA"
          fi

          if [ -n "$base_sha" ] && [ "$base_sha" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git diff --check "$base_sha" "$CURRENT_SHA"
            changed_lines="$(git diff --unified=0 "$base_sha" "$CURRENT_SHA")"
          elif git rev-parse "$CURRENT_SHA^" >/dev/null 2>&1; then
            parent_sha="$(git rev-parse "$CURRENT_SHA^")"
            git diff --check "$parent_sha" "$CURRENT_SHA"
            changed_lines="$(git diff --unified=0 "$parent_sha" "$CURRENT_SHA")"
          else
            git diff-tree --check --root "$CURRENT_SHA"
            changed_lines="$(git diff-tree --unified=0 --root --no-commit-id -r "$CURRENT_SHA")"
          fi

          if printf '%s\n' "$changed_lines" | grep -nE '^\+[^+].*(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})'; then
            echo 'Potential credential pattern detected in added lines.' >&2
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Architecture checker tests
        run: npm run test:architecture
      - name: Strict architecture check
        run: npm run architecture:check:strict
      - name: Unit and domain tests
        run: npm test -- --exclude '**/*.integration.spec.ts'
      - name: PostgreSQL integration (fail on missing/skipped suites)
        run: npm run test:integration:ci
      - name: Coverage (80% line threshold, including PostgreSQL)
        run: npm run test:cov -- --no-file-parallelism
      - name: Build
        run: npm run build
      - name: E2E HTTP smoke
        run: npm run test:e2e
