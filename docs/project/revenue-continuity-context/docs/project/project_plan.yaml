nguyen_tac:
- Nghiên cứu và kiểm chứng trước khi mở rộng xây dựng.
- Mốc thời gian là baseline quản trị, không phải cam kết cứng.
- Không qua cổng quyết định thì phải thu hẹp, đổi hướng hoặc lùi lịch; không tự động tiếp tục build.
- P0 = bắt buộc để qua cổng; P1 = quan trọng; P2 = có thể hoãn.
- Ưu tiên tiếng Việt; chỉ giữ thuật ngữ ngành phổ biến khi dịch gây khó hiểu hơn.
- Excel là bản quản trị cho người; YAML là bản cấu trúc cho AI. Khi có khác biệt, cần đối chiếu và nêu rõ trước khi sửa.
