    ràng.
- task_id: '2.14'
  task: Rà soát kiến trúc + ước lượng công sức
  deadline: '2026-11-19'
  gate_or_milestone: Cổng 2
  deliverable: Kiến trúc + ước lượng
  description: Rà soát đầu-cuối, xác định trở ngại cứng, ước lượng xây dựng theo khối công việc và xác nhận phần để sau.
- task_id: '2.15'
  task: 'Cổng 2: Xây / Thu hẹp / Thử nghiệm lại'
  deadline: '2026-11-20'
  gate_or_milestone: Cổng 2 - 20/11
  deliverable: Quyết định xây dựng
  description: Chỉ tiếp tục nếu nạp dữ liệu Pancake + định danh + dòng liên kết đầu-cuối đủ khả thi cho Pilot và phạm vi MVP
    phù hợp năng lực đội ngũ.
- task_id: '6.14'
  task: 'Cổng 3: Sẵn sàng Alpha?'
  deadline: '2027-02-12'
  gate_or_milestone: Cổng 3 - 12/02
  deliverable: Quyết định Alpha đi/không đi
  description: Cho Pilot chạy nếu E2E P0 đạt, không có lỗi bảo mật nghiêm trọng, sổ tay/đào tạo sẵn sàng và kết nối đủ ổn
    định.
- task_id: '7.6'
  task: Đợt 1 vận hành thật
  deadline: '2027-02-24'
  gate_or_milestone: 'Mốc: Đợt 1 vận hành thật'
  deliverable: Pilot vận hành thật
  description: Bắt đầu xử lý Lead thật; hỗ trợ hàng ngày trong tuần đầu; nhóm sản phẩm theo dõi chỉ số trọng yếu.
- task_id: '7.14'
  task: Tổng kết kinh doanh Đợt 1
  deadline: '2027-04-02'
  gate_or_milestone: Cổng 4 - 02/04
  deliverable: Tổng kết kinh doanh Đợt 1
  description: Trình bày trước/sau, lưu ý về sức khoẻ dữ liệu, giá trị thu hồi, mức sử dụng, trở ngại chưa giải quyết và trích
    dẫn/quyết định của khách hàng.
- task_id: '7.15'
  task: 'Cổng 4: giá trị có lặp lại?'
  deadline: '2027-04-02'
  gate_or_milestone: Cổng 4 - 02/04
  deliverable: Quyết định Đợt 2
  description: 'Quyết định tiếp tục/thu hẹp/chuyên sâu theo ngành. Gợi ý đạt: 3+ đối tác cho thấy giá trị rõ, quy trình phần
    lớn lặp lại, công sức triển khai giảm và người bảo trợ sẵn sàng trả tiền/tiếp tục.'
- task_id: '10.12'
  task: 'Cổng 5: Sẵn sàng thương mại?'
  deadline: '2027-06-04'
  gate_or_milestone: Cổng 5 - 04/06
  deliverable: Ra mắt giới hạn decision
  description: Đạt nếu giá trị lặp lại, khách sẵn sàng trả phí, hiệu quả kinh tế triển khai chấp nhận được, độ tin cậy dữ
    liệu/bảo mật đủ mức và sổ tay hỗ trợ sẵn sàng.
- task_id: '11.2'
  task: Ra mắt giới hạn
  deadline: '2027-06-14'
  gate_or_milestone: 'Mốc: 14/06/2027'
  deliverable: v1 thương mại giới hạn
  description: Chỉ mở bán cho ICP đạt chuẩn; mặc định vẫn tạo tài khoản thủ công + triển khai có hướng dẫn.
- task_id: '11.6'
  task: Quyết định hướng mở rộng
  deadline: '2027-06-30'
  gate_or_milestone: 'Mốc: Rà soát tháng 6'
  deliverable: Quyết định chiến lược nửa cuối 2027
  description: 'Rà soát cuối tháng 6: tiếp tục bán có Sales dẫn dắt, chuyên sâu hơn theo ngành, thêm kết nối nguồn thu hút
    khách, đầu tư tự phục vụ hoặc lùi lại theo bằng chứng.'
