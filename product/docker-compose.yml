services:
  postgres:
    image: postgres:16-alpine
    container_name: north-star-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-north_star}
      POSTGRES_USER: ${POSTGRES_USER:-north_star}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-north_star}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-north_star} -d ${POSTGRES_DB:-north_star}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
